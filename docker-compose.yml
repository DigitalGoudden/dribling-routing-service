services:
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: routing_valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./custom_files:/custom_files
    environment:
      - serve_tiles=True
      - build_elevation=False
      - tile_extract=False
      - build_admins=True
      - build_time_zones=True
      - use_tiles_ignore_pbf=True
    networks:
      - routing_network

  vroom:
    image: ghcr.io/vroom-project/vroom-docker:latest
    container_name: routing_vroom
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./vroom_conf/config.yml:/conf/config.yml:ro
    environment:
      - VROOM_ROUTER=valhalla
    depends_on:
      - valhalla
    networks:
      - routing_network

  routing_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: routing_api
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - DEFAULT_COUNTRY=chile
      - VALHALLA_URL=http://valhalla:8002
      - VROOM_URL=http://vroom:3000
      - ENVIRONMENT=production
    depends_on:
      - valhalla
      - vroom
    networks:
      - routing_network

networks:
  routing_network:
    driver: bridge
