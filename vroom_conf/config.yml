cliArgs:
  geometry: true
  planmode: false
  threads: 4
  explore: 5
  limit: '10mb'
  logdir: '..'
  logsize: '100M'
  maxlocations: 2000
  maxvehicles: 500
  override: ['c', 'g', 'l', 't', 'x']
  path: ''
  port: 3000
  router: 'valhalla'
  timeout: 300000
  baseurl: '/'

routingServers:
  valhalla:
    auto:
      host: 'valhalla'
      port: '8002'
